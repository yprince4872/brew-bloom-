<style>

.mq{margin:1rem 0}

.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}

}

@media(max-width:760px){.days{margin-inline:-1rem;padding-inline:1rem}}

if(cb.sel!=null){const f=fc(cb.sel);body+=f.length?`<div class="panel"><h3>${t12(cb.sel)} to ${t12(cb.sel+len)}: choose a cabin</h3><div class="sl">${av.cabins.map(c=>{const ok=f.some(x=>x.id==c.id);return `<button class="chip ${cb.cab==c.id?"on":""}" ${ok?"":"disabled"} data-a="cabin" data-id="${c.id}">${esc(c.name)}<br><small>${ok?"Free":"Booked"}</small></button>`}).join("")}</div>`+(me?`<div class="panel" style="background:var(--bg);margin-top:1rem"><div class="ln"><b>Cabin charge</b><span>${rs(av.rate)} per hour</span></div><div class="ln"><b>Total for ${dl(len)}</b><span class="pr">${rs(av.rate*cb.dur)}</span></div><div class="ln"><b>Advance to pay now</b><span class="pr">${rs(av.advance)}</span></div><div class="ln"><b>Balance to pay at the café</b><span>${rs(Math.max(0,av.rate*cb.dur-av.advance))}</span></div></div><p style="color:var(--mut);font-size:.9rem">The advance is <b>non-refundable</b> if you cancel. Your cabin is booked as soon as the payment goes through.</p><label>Note (optional)<input id="bn" maxlength="200"></label><button class="btn mag" id="bb" data-a="book">Pay ${rs(av.advance)} and book this cabin</button>`:`<a class="btn mag" href="#account" data-a="nx" data-id="#cabins">Log in to book</a>`)+`</div>`:`<div class="panel"><p>No cabin is free at this time any more. Please choose another time.</p></div>`}}
const dn=cb.done,done=dn?`<div class="panel" style="margin:1rem 0"><h3>${dn.status=="Confirmed"?"Cabin booked and confirmed":"Payment received"}</h3><p>${dn.status=="Confirmed"?`Cabin ${dn.cabin}, ${fd(dn.date)}, ${s12(dn.start)} to ${s12(dn.end)}. Please pay the balance of ${rs(dn.total-dn.advance)} at the café.`:"Someone booked this cabin just before your payment went through. We will contact you shortly to sort it out."} You can see it in <a href="#account" style="text-decoration:underline">your account</a>.</p></div>`:"";
return `<section class="sec wrap">${top}${done}${body}</section>`},
account(){const td=new Date().toLocaleDateString("en-CA");
if(!me){const su=mode=="signup";return `<section class="sec wrap"><div class="panel" style="max-width:460px"><h2 style="font-size:2rem">${su?"Create account":"Log in"}</h2><p style="color:var(--mut)">Use your mobile number and a PIN to see your orders and cabin bookings.</p>${su?'<label>Your name<input id="an" maxlength="60" autocomplete="name"></label>':""}<label>Mobile number<input id="ap" inputmode="numeric" maxlength="10" autocomplete="tel"></label><label>PIN (4 to 6 digits)<input id="apin" type="password" inputmode="numeric" maxlength="6" autocomplete="${su?"new-password":"current-password"}"></label><button class="btn mag" id="ab" data-a="auth" style="width:100%">${su?"Create account":"Log in"}</button><p style="margin-top:1rem">${su?"Already have an account?":"New here?"} <a href="#account" data-a="mode" data-id="${su?"login":"signup"}" style="text-decoration:underline;font-weight:600">${su?"Log in":"Create an account"}</a></p><small style="color:var(--mut)">Forgot your PIN? Ask at the café and we will reset it.</small></div></section>`}
const sl=s=>s=="Pending"?"Paid, we will contact you":s;
return `<section class="sec wrap"><div class="row"><h2 style="margin:0">Hello, ${esc(me.name)}</h2><button class="btn ghost" data-a="logout">Log out</button></div>
<div class="panel" style="margin-top:1.2rem"><h3>Cabin bookings</h3>${myB.map(b=>`<div class="ln"><b>${fd(b.date)}, ${s12(b.start)} to ${s12(b.end)}<br><small>Cabin ${b.cabin}${b.total?" · "+rs(b.total)+" total, "+rs(b.advance)+" advance paid":""}${b.note?" · "+esc(b.note):""}</small></b><span class="tag ${b.status}">${sl(b.status)}</span>${b.status!="Cancelled"&&b.date>=td?`<button class="chip" data-a="cancelB" data-id="${b._id}">Cancel</button>`:""}</div>`).join("")||'<p style="color:var(--mut)">No cabin bookings yet.</p>'}<a class="btn ghost mag" href="#cabins" style="margin-top:1rem">Book a cabin</a></div>
<div class="panel"><h3>My orders</h3>${myO.map(o=>`<div class="ln"><b>${esc(o.code)}<br><small>${new Date(o.createdAt).toLocaleString("en-IN")}${o.tableNo?" · Table "+esc(o.tableNo):""}</small><br><small>${o.items.map(i=>esc(i.name)+" x"+i.qty).join(", ")}</small></b><span class="pr">${rs(o.total)}</span><span class="tag ${o.status}">${o.status}</span></div>`).join("")||'<p style="color:var(--mut)">No orders yet.</p>'}<a class="btn ghost mag" href="#menu" style="margin-top:1rem">Order something</a></div></section>`},
cart(){if(last){const o=last;return `<section class="sec wrap"><div class="panel"><h2>Order ${esc(o.code)} placed</h2><p>Thank you, ${esc(o.name)}. Payment received (ref ${esc(o.txn)}). We have started preparing your order. You can see it any time in <a href="#account" style="text-decoration:underline">your account</a>. Show this order number at the counter.</p><a class="btn mag" href="#menu">Order more</a></div></section>`}
const ls=Object.entries(cart).map(([i,q])=>({m:find(i),q})).filter(x=>x.m);
if(!ls.length)return `<section class="sec wrap"><div class="panel"><h2>Your cart is empty</h2><p style="color:var(--mut)">Pick something from the menu to get started.</p><a class="btn mag" href="#menu">Browse the menu</a></div></section>`;
if(!me)return `<section class="sec wrap"><div class="panel" style="max-width:520px"><h2>Log in to place your order</h2><p style="color:var(--mut)">Your cart is saved. Log in with your mobile number and PIN so you can see this order later in your account.</p><a class="btn mag" href="#account" data-a="nx" data-id="#cart">Log in or create account</a></div></section>`;
const t=sum();
return `<section class="sec wrap two"><div class="panel"><h2 style="font-size:2rem">Your order</h2>${ls.map(({m,q})=>`<div class="ln"><span class="th">${m.img?`<img src="${esc(m.img)}" alt="">`:esc(m.emoji)}</span><b>${esc(m.name)}</b><span class="q"><button data-a="dec" data-id="${m._id}" aria-label="Remove one">−</button>${q}<button data-a="inc" data-id="${m._id}" aria-label="Add one">+</button></span><span class="pr">${rs(m.price*q)}</span></div>`).join("")}<p class="row"><span>Total</span><span class="tot">${rs(t)}</span></p></div>
<div class="panel"><h2 style="font-size:1.6rem">Your details</h2><p style="color:var(--mut)">Ordering as <b>${esc(me.name)}</b> (${esc(me.phone)})</p><label>Table number (for dine-in)<input id="tb" maxlength="10"></label><label>Note for the kitchen<input id="nt" maxlength="200"></label>
<button class="btn mag" id="pb" data-a="place" style="width:100%">Pay ${rs(t)}</button><small style="color:var(--mut);display:block;margin-top:.6rem">Pay with PhonePe, Google Pay, Paytm or any UPI app. Cards and netbanking also work.</small></div></section>`}};
const A={
theme(){const r=document.documentElement,d=r.dataset.theme?r.dataset.theme=="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=d?"light":"dark"},
add(i){cart[i]=(cart[i]||0)+1;cc();toast("Added to cart")},
inc(i){cart[i]++;cc();draw()},dec(i){if(--cart[i]<=0)delete cart[i];cc();draw()},
flt(c){flt=c;draw()},
nx(i){nxt=i},
mode(i){mode=i;draw()},
async auth(){const ph=$("#ap").value.trim(),pin=$("#apin").value.trim(),nm=mode=="signup"?$("#an").value.trim():"";
if(mode=="signup"&&!nm)return toast("Enter your name");if(!/^\d{10}$/.test(ph))return toast("Enter a 10-digit mobile number");if(!/^\d{4,6}$/.test(pin))return toast("PIN must be 4 to 6 digits");
const b=$("#ab");b.disabled=true;
try{const r=await api("/api/auth/"+(mode=="signup"?"register":"login"),{method:"POST",headers:H,body:JSON.stringify({name:nm,phone:ph,pin})});setTk(r.token);me=r.user;brand();const h=nxt;nxt="";if(h&&h!==location.hash)location.hash=h;else enter()}
catch(e){toast(e.message);b.disabled=false}},
logout(){setTk(null);me=null;myO=[];myB=[];brand();draw()},
async cancelB(i){if(!confirm("Cancel this booking? Your advance payment will not be refunded."))return;try{await api("/api/my/bookings/"+i+"/cancel",{method:"POST"});await accLoad();draw();toast("Booking cancelled")}catch(e){toast(e.message)}},
async day(i){cb.date=i;cb.sel=null;cb.cab=null;cb.done=0;await cabLoad();draw()},
pick(i){cb.sel=+i;cb.cab=null;cb.done=0;draw()},
cabin(i){cb.cab=+i;draw()},
async book(){if(cb.cab==null)return toast("Choose a cabin");const b=$("#bb"),bt=b.textContent,off=()=>{b.disabled=false;b.textContent=bt};b.disabled=true;b.textContent="Starting payment";
try{await rzp();
const d=await api("/api/bookings/create",{method:"POST",headers:H,body:JSON.stringify({date:cb.date,start:hm(cb.sel),hours:cb.dur,cabin:cb.cab,note:$("#bn")?$("#bn").value:""})});
new Razorpay({key:d.key,order_id:d.orderId,amount:d.amount,currency:"INR",name:S.cfg.name,description:"Cabin advance",prefill:{name:me.name,contact:me.phone},theme:{color:"#f4b942"},
handler:async r=>{try{cb.done=await api("/api/bookings/verify",{method:"POST",headers:H,body:JSON.stringify({orderId:r.razorpay_order_id,paymentId:r.razorpay_payment_id,signature:r.razorpay_signature})});cb.sel=null;cb.cab=null}catch(e){toast(e.message)}await cabLoad();draw()},
modal:{ondismiss:async()=>{await cabLoad();draw()}}}).open()}
catch(e){toast(e.message);off();await cabLoad();draw()}},
async place(){
const b=$("#pb"),bt=b.textContent,off=()=>{b.disabled=false;b.textContent=bt};b.disabled=true;b.textContent="Starting payment";
try{await rzp();
const d=await api("/api/orders/create",{method:"POST",headers:H,body:JSON.stringify({tableNo:$("#tb").value,note:$("#nt").value,items:Object.entries(cart).map(([id,qty])=>({id,qty}))})});
new Razorpay({key:d.key,order_id:d.orderId,amount:d.amount,currency:"INR",name:S.cfg.name,description:"Café order "+d.code,prefill:{name:me.name,contact:me.phone},theme:{color:"#f4b942"},
handler:async r=>{try{last=await api("/api/orders/verify",{method:"POST",headers:H,body:JSON.stringify({orderId:r.razorpay_order_id,paymentId:r.razorpay_payment_id,signature:r.razorpay_signature})});cart={};cc();draw()}catch(e){toast(e.message);off()}},
modal:{ondismiss:off}}).open()}catch(e){toast(e.message);off()}}};
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset.id)});
const C={async date(v){cb.date=v;cb.sel=null;cb.cab=null;cb.done=0;await cabLoad();draw()},dur(v){cb.dur=+v;cb.sel=null;cb.cab=null;draw()}};
document.addEventListener("change",e=>{const t=e.target.closest("[data-c]");if(t&&C[t.dataset.c])C[t.dataset.c](t.value)});
async function enter(d){await load();const r=(location.hash||"#home").slice(1);if(r=="account"&&me)await accLoad();if(r=="cabins")await cabLoad();if(d)await new Promise(k=>setTimeout(k,d));draw();if(d)scrollTo(0,0)}
function cc(){$("#cc").textContent=cnt()}
function brand(){$("#acl").textContent=me?me.name.split(" ")[0]:"Login";$("#lg").textContent=S.cfg.name;document.title=S.cfg.name+" Café";$("#ft").textContent=[S.cfg.name+" Café",S.cfg.hours,S.cfg.address,S.cfg.phone].filter(Boolean).join(". ")}
function obs(){const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.12});document.querySelectorAll(".rv").forEach((e,i)=>{e.style.transitionDelay=(i%4)*70+"ms";io.observe(e)})}
function draw(){const r=(location.hash||"#home").slice(1),v=V[r]?r:"home";if(v!="cart")last=null;
$("#app").innerHTML=V[v]();document.querySelectorAll("[data-r]").forEach(a=>a.classList.toggle("on",a.dataset.r==v));
obs();hf();const dv=$(".days"),on=dv&&dv.querySelector(".on");if(on)dv.scrollLeft=on.offsetLeft-dv.clientWidth/2+on.offsetWidth/2}
function go(){const w=$("#wp");w.classList.remove("go");void w.offsetWidth;w.classList.add("go");enter(250)}
addEventListener("hashchange",go);
let hc=[],par=[],ptick=0;function hf(){hc=[...document.querySelectorAll("#h1 .ch")];par=[...document.querySelectorAll("[data-p]")]}
let px=-999,py=-999,raf=0;
addEventListener("pointermove",e=>{if(e.pointerType&&e.pointerType!=="mouse")return;px=e.clientX;py=e.clientY;const d=$("#cd"),r=$("#cr");d.style.transform=`translate(${px}px,${py}px)`;r.style.transform=`translate(${px}px,${py}px)`;r.classList.toggle("big2",!!e.target.closest("a,button,.card,.chip"));
const c=e.target.closest(".card");if(c){const b=c.getBoundingClientRect(),x=(px-b.left)/b.width-.5,y=(py-b.top)/b.height-.5;c.style.transform=`perspective(700px) rotateY(${x*14}deg) rotateX(${-y*14}deg)`}
const m=e.target.closest(".mag");if(m){const b=m.getBoundingClientRect();m.style.transform=`translate(${(px-b.left-b.width/2)*.25}px,${(py-b.top-b.height/2)*.35}px)`}
if(!raf)raf=requestAnimationFrame(()=>{raf=0;hc.forEach(s=>{const b=s.getBoundingClientRect(),d=Math.hypot(px-b.left-b.width/2,py-b.top-b.height/2),k=Math.max(0,1-d/260);s.style.fontVariationSettings=`"wght" ${300+k*500},"wdth" ${100-k*20}`})})});
document.addEventListener("pointerout",e=>{const c=e.target.closest(".card,.mag");if(c&&!c.contains(e.relatedTarget))c.style.transform=""});
addEventListener("scroll",()=>{const r=$("#cr");r.classList.add("hide");clearTimeout(window.sh);window.sh=setTimeout(()=>r.classList.remove("hide"),200);if(!ptick)ptick=requestAnimationFrame(()=>{ptick=0;const y=scrollY;par.forEach(e=>e.style.transform=`translateY(${y*e.dataset.p}px)`)})},{passive:true});
brand();draw();enter();
</script></body></html>
